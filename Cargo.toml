[package]
name = "sigmaos-xtask"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS xtask — kernel/userspace build runner and QEMU orchestrator"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
sigmaos-sigma-bootloader = { path = "../SigmaOS-sigma-bootloader" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
env_logger = "0.11"
log = "0.4"
directories = "6"
